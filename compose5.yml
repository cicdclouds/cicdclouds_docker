# Postgres and it adminer  setup using docker-compose
---
verison: '3.8'
services:
  database:
      image: postgres:13
      container_name: pg_database
      environment:
        POSTGRES_DB: pg_database
        POSTGRES_USER: prasad
        POSTGRES_PASSWORD: prasad123
  webserver:
      image: php:8.2-apache
      container_name: web_server
      ports:
        - "8080:80"
      depends_on:
        - database
  adminer:
      image: adminer
      container_name: adminer_tool
      ports:
        - "8081:8080"
      depends_on:
        - web_server
        - database
...
