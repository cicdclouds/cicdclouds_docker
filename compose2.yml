#cross browser and cross plot form done by seleinum
---
version: '3.8'
services: 
   debug_hub: 
     image: selenium/hub:latest
     container_name: selenium-hub 
     ports:
       - "4444:4444"
   chrome_node:
     image: selenium/node_chrome-debug:latest
     container_name: chrome_node
     ports:
        - "5900:5900"
     depends_on:
        - debug_hub
   firefox_node:
      image: selenium/node_firefoc-debug:latest
      container_name: firefox_node
      ports: 
         - "5901:5900"
      depends_on:
         - debug_hub
